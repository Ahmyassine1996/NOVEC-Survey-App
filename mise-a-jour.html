<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mise à jour NOVEC</title><style>body{font:18px system-ui;max-width:650px;margin:50px auto;padding:24px;color:#153c3b}button{padding:18px;background:#086c61;color:white;border:0;border-radius:10px;font:inherit}</style><h1>Mettre à jour NOVEC Survey</h1><p>Exportez vos enquêtes dans l’ancienne application, puis fermez ses autres fenêtres avant de continuer. Cette opération conserve la base locale des enquêtes.</p><button id="update">Installer la version 1.1</button><p id="status" role="status"></p><script>
const button=document.querySelector('#update'),status=document.querySelector('#status');button.onclick=async()=>{button.disabled=true;status.textContent='Téléchargement de la mise à jour…';try{const reg=await navigator.serviceWorker.register('./sw.js?v=1.1.0',{updateViaCache:'none'});await reg.update();const worker=reg.installing||reg.waiting||reg.active;if(worker.state==='installing')await new Promise((resolve,reject)=>{worker.addEventListener('statechange',()=>{if(worker.state==='installed')resolve();if(worker.state==='redundant')reject(new Error('Téléchargement interrompu'));});});const ready=reg.waiting||reg.active;if(ready.state!=='activated'){ready.postMessage({type:'ACTIVATE'});await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(new Error('Fermez les autres fenêtres et réessayez.')),20000);ready.addEventListener('statechange',()=>{if(ready.state==='activated'){clearTimeout(timer);resolve();}});});}location.replace('./?version=1.1.0');}catch(e){status.textContent='Mise à jour non terminée : '+e.message;button.disabled=false;}};
</script></html>
